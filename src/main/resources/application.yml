spring:
  application:
    name: future-message
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/future_message}
    username: ${DB_USERNAME:future}
    password: ${DB_PASSWORD:future}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

app:
  timezone: Asia/Ho_Chi_Minh
  mail:
    from: ${MAIL_FROM:noreply@futuremessage.local}

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.mail: INFO
