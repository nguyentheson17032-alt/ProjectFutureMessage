spring:
  application:
    name: future-message
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/future_message}
    username: ${DB_USERNAME:future}
    password: ${DB_PASSWORD:future}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  timezone: Asia/Ho_Chi_Minh
  scheduler:
    unlock:
      enabled: true
      interval: 30s
      batch-size: 50
    notification:
      enabled: true
      interval: 30s
      batch-size: 50
  mail:
    from: ${MAIL_FROM:noreply@futuremessage.local}
    inbox-url: ${MAIL_INBOX_URL:http://localhost:5173/inbox}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-32bytes-min-key!}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}"
  auth:
    rate-limit-requests: 20
    rate-limit-window: 1m
  admin:
    email: ${ADMIN_EMAIL:admin@futuremessage.local}
    password: ${ADMIN_PASSWORD:adminpass1}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
    display-request-duration: true
    try-it-out-enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  show-actuator: false

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.mail: INFO
    com.futuremessage.scheduler: INFO
    com.futuremessage.service.UnlockService: INFO
    com.futuremessage.service.NotificationService: INFO
    com.futuremessage.mail: INFO
