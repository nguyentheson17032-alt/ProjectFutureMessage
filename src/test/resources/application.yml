spring:
  datasource:
    url: jdbc:h2:mem:future_message;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: test-jwt-secret-key-32-bytes-min!!
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: http://localhost:3000
  auth:
    rate-limit-requests: 1000
    rate-limit-window: 1m
